<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Enigmatica cipher lab mark">
  <defs>
    <linearGradient id="gem" x1="120" y1="90" x2="400" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cba6f7"/>
      <stop offset="0.55" stop-color="#b4befe"/>
      <stop offset="1" stop-color="#89b4fa"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(256 220) rotate(90) scale(260)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#313244" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1e1e2e" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#1e1e2e"/>
  <rect x="20" y="20" width="472" height="472" rx="98" fill="url(#halo)" stroke="#cdd6f4" stroke-opacity="0.08" stroke-width="2"/>

  <circle cx="256" cy="256" r="176" fill="none" stroke="#89b4fa" stroke-opacity="0.55" stroke-width="3"/>
  <circle cx="256" cy="256" r="142" fill="none" stroke="#cba6f7" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="3 11"/>

  <g stroke="#b4befe" stroke-opacity="0.45" stroke-width="4" stroke-linecap="round">
    <line x1="256" y1="62" x2="256" y2="80"/>
    <line x1="256" y1="432" x2="256" y2="450"/>
    <line x1="62" y1="256" x2="80" y2="256"/>
    <line x1="432" y1="256" x2="450" y2="256"/>
    <line x1="119" y1="119" x2="132" y2="132"/>
    <line x1="380" y1="380" x2="393" y2="393"/>
    <line x1="119" y1="393" x2="132" y2="380"/>
    <line x1="380" y1="132" x2="393" y2="119"/>
  </g>

  <g filter="url(#glow)">
    <path d="M256 142 L370 256 L256 370 L142 256 Z" fill="url(#gem)" fill-opacity="0.13" stroke="url(#gem)" stroke-width="7" stroke-linejoin="round"/>
    <path d="M256 190 L322 256 L256 322 L190 256 Z" fill="#1e1e2e" stroke="#94e2d5" stroke-opacity="0.65" stroke-width="3"/>
